<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fitness League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0e11;--panel:#151920;--panel2:#1c212a;--line:#272e38;
  --text:#eef1f4;--muted:#8b95a3;--accent:#c8ff3d;--accent-ink:#141a05;
  --gold:#ffcf40;--silver:#c9d1db;--bronze:#d99560;--danger:#ff6060;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:110px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:100%}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.display{font-family:"Bebas Neue",Impact,sans-serif;letter-spacing:.02em;line-height:.95;font-weight:400}
.muted{color:var(--muted)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.center-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:20px;padding:24px}
#signin h1{font-size:clamp(64px,16vw,120px);color:var(--accent)}
#signin p{max-width:320px;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 22px;border-radius:999px;font-weight:700}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{border:1px solid var(--line);color:var(--muted);padding:9px 16px;font-weight:600;font-size:14px}
.btn-sm{padding:7px 12px;font-size:13px}
.link{color:var(--accent);font-weight:600;font-size:13px}

/* header */
header{position:sticky;top:0;z-index:5;background:rgba(12,14,17,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.brand{font-size:30px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hright{display:flex;align-items:center;gap:8px;flex:none}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:17px}
.avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;flex:none;display:grid;place-items:center;font-weight:800;line-height:1}
.tabs{display:flex;gap:4px;padding-bottom:10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.tab.on{background:var(--panel2);color:var(--text)}

/* week/day bar */
.weekbar{display:flex;align-items:center;justify-content:space-between;margin:22px 0 6px;gap:10px}
.weekbar .display{font-size:clamp(24px,7vw,32px);text-align:center}
.arrow{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);font-size:18px;flex:none}
.arrow:disabled{opacity:.25;cursor:default}
.lock{text-align:center;font-size:13px;color:var(--muted);margin-bottom:18px}
.lock b{color:var(--accent);font-weight:700}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;margin-bottom:12px;overflow:hidden}
.pad{padding:16px}
.row{display:grid;grid-template-columns:44px 40px 1fr auto;align-items:center;gap:12px;padding:16px;width:100%;text-align:left}
.rank{font-size:34px;text-align:center}
.r1 .rank{color:var(--gold)}.r2 .rank{color:var(--silver)}.r3 .rank{color:var(--bronze)}
.r1{border-color:rgba(255,207,64,.45)}
.name{font-weight:700;font-size:17px}
.you{color:var(--muted);font-weight:500;font-size:13px}
.flame{font-size:13px;font-weight:700;color:#ff9a3d;margin-left:4px}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
.pts{font-size:46px;text-align:right}
.pts small{font-family:Inter;font-size:12px;color:var(--muted);letter-spacing:0;display:block}
.bar{height:4px;background:var(--panel2);margin:0 16px 14px;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.r1 .bar i{background:var(--gold)}
.detail{border-top:1px solid var(--line);padding:16px;display:none}
.card.open .detail{display:block}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.cat{background:var(--panel2);border-radius:12px;padding:10px 4px;text-align:center}
.cat .display{font-size:28px}
.cat span{font-size:11px;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px;text-align:center}
.day{background:var(--panel2);border-radius:10px;padding:8px 0}
.day span{display:block;font-size:11px;color:var(--muted)}
.day b{font-family:"Bebas Neue";font-size:22px;font-weight:400}
.day.zero b{color:#4a5260}
.entry{padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.entry:first-child{border-top:0}
.e-top{display:flex;align-items:center;gap:10px}
.e-main{flex:1;min-width:0}
.e-sub{font-size:12px;color:var(--muted)}
.e-pts{font-weight:700;color:var(--accent);white-space:nowrap}
.pr{display:inline-block;background:var(--gold);color:#2a1d00;font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:2px}
.del{width:28px;height:28px;border-radius:50%;color:var(--muted);font-size:16px}
.del:hover{background:var(--panel2);color:var(--danger)}
.reacts{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0 30px}
.rchip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:13px}
.rchip.mine{border-color:var(--accent)}
.radd{color:var(--muted);font-size:12px;padding:2px 8px;border-radius:999px;border:1px dashed var(--line)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.dchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.dchip{background:var(--panel2);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted)}
.dchip b{color:var(--text)}
.goalline{font-size:12px;color:var(--muted);margin-top:3px}

/* recap */
.recap{border-color:rgba(200,255,61,.35);background:linear-gradient(180deg,rgba(200,255,61,.07),transparent 60%),var(--panel)}
.recap h3{font-size:30px;color:var(--accent);margin-bottom:10px}
.recap li{list-style:none;padding:6px 0;font-size:14px;border-top:1px solid var(--line)}
.recap li:first-child{border-top:0}

/* tables */
h2.display{font-size:40px;margin:24px 0 14px}
h3.sec{font-size:30px;margin:26px 0 12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;text-align:left;padding:8px}
td{padding:11px 8px;border-top:1px solid var(--line)}
td.n{font-family:"Bebas Neue";font-size:24px}
td.win{color:var(--accent)}
.rules li{margin:0 0 10px 18px;line-height:1.5}
.note{font-size:12px;color:var(--muted);line-height:1.45}
.seg{display:inline-flex;background:var(--panel2);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--text)}
.cmp-sel{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:14px}
.vs{font-family:"Bebas Neue";font-size:26px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0}

/* sheets */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));z-index:6;box-shadow:0 10px 30px rgba(200,255,61,.25);font-size:17px;padding:16px 34px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--panel);border-radius:22px 22px 0 0;border-top:1px solid var(--line);max-height:90vh;overflow:auto;padding:20px 16px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease}
.sheet.on{transform:none}
.sheet-in{max-width:640px;margin:0 auto}
.sheet h3{font-size:36px}
.sheet-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.sheet-top select{width:auto;padding:8px 12px;font-size:14px}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-size:14px;font-weight:600}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip:disabled{opacity:.35;cursor:default}
.chip.preset{background:transparent;border-color:var(--accent);color:var(--accent)}
.field{margin-top:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.inline{display:flex;align-items:center;gap:10px}
.inline span{color:var(--muted);white-space:nowrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.swatch.on{border-color:var(--text)}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emojis button{font-size:22px;padding:6px 0;border-radius:10px;background:var(--panel2)}
.emojis button.on{outline:2px solid var(--accent)}
.actions{display:flex;gap:10px;margin-top:18px}
.actions .btn{flex:1}
.err{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px}
.prof-head{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stat{background:var(--panel2);border-radius:12px;padding:10px 4px;text-align:center}
.stat .display{font-size:30px}
.stat span{font-size:11px;color:var(--muted)}
.set-row{display:grid;grid-template-columns:1fr 70px 70px auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.set-row input{padding:8px 10px;font-size:13px}
.set-row .lbl{display:flex;align-items:center;gap:6px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;pointer-events:auto}
.toast button{margin-left:12px;font-weight:800;text-decoration:underline}
@media (max-width:480px){.pts{font-size:38px}.row{grid-template-columns:30px 34px 1fr auto;gap:10px;padding:14px}.rank{font-size:28px}.cats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div id="loading" class="center-screen"><div class="display" style="font-size:40px;color:var(--accent)">Loading…</div></div>

<div id="signin" class="center-screen" hidden>
  <h1 class="display" id="signinTitle">Fitness<br>League</h1>
  <p class="muted">Log your workouts, learning and daily goals. Highest points by Sunday night wins the week.</p>
  <button class="btn btn-primary" id="signinBtn">Sign in with Google</button>
  <div class="err" id="signinErr"></div>
</div>

<div id="app" hidden>
  <header>
    <div class="wrap">
      <div class="hrow">
        <div class="brand display" id="brand">Fitness League</div>
        <div class="hright">
          <button class="icon-btn" id="settingsBtn" title="League settings" hidden>⚙️</button>
          <button id="meBtn" title="Your profile"></button>
        </div>
      </div>
      <nav class="tabs">
        <button class="tab on" data-tab="board">This week</button>
        <button class="tab" data-tab="daily">Daily</button>
        <button class="tab" data-tab="season">Season</button>
        <button class="tab" data-tab="compare">Compare</button>
        <button class="tab" data-tab="rules">Points</button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section id="tab-board">
      <div class="weekbar">
        <button class="arrow" id="prevWk" aria-label="Previous week">‹</button>
        <div class="display" id="wkLabel"></div>
        <button class="arrow" id="nextWk" aria-label="Next week">›</button>
      </div>
      <div class="lock" id="lockLabel"></div>
      <div id="recap"></div>
      <div id="board"></div>
    </section>
    <section id="tab-daily" hidden>
      <div class="weekbar">
        <button class="arrow" id="prevDay" aria-label="Previous day">‹</button>
        <div class="display" id="dayLabel"></div>
        <button class="arrow" id="nextDay" aria-label="Next day">›</button>
      </div>
      <div class="lock" id="dayStrip"></div>
      <div id="daily"></div>
    </section>
    <section id="tab-season" hidden><div id="season"></div></section>
    <section id="tab-compare" hidden><div id="compare"></div></section>
    <section id="tab-rules" hidden><div id="rules"></div></section>
  </main>

  <button class="btn btn-primary fab" id="logBtn">+ Log activity</button>
</div>

<div class="scrim" id="scrim"></div>

<!-- log sheet -->
<div class="sheet" id="sheet" role="dialog" aria-label="Log activity">
  <div class="sheet-in">
    <div class="sheet-top">
      <h3 class="display">Log activity</h3>
      <select id="dateIn" aria-label="Day"></select>
    </div>
    <p class="note">Tap to add. Flat-point items log instantly; for the rest, tap an amount.</p>
    <div id="actChips"></div>
    <div id="amtPanel" hidden>
      <div class="note" id="actNote" style="margin-top:14px"></div>
      <div class="field" id="noteField" hidden>
        <label for="noteIn">What did you learn? (optional)</label>
        <input id="noteIn" maxlength="80" placeholder="e.g. new piano song, juggling 3 balls">
      </div>
      <div class="grp" id="presetLbl"></div>
      <div class="chips" id="presets"></div>
      <div class="field">
        <label for="amt">Or enter exact</label>
        <div class="inline"><input id="amt" type="number" inputmode="decimal" min="0"><span id="unit"></span>
          <button class="btn btn-primary" id="saveLog" style="padding:12px 18px">Add <span id="preview"></span></button></div>
      </div>
    </div>
    <div class="err" id="logErr"></div>
    <div class="actions"><button class="btn btn-ghost" id="cancelLog">Done</button></div>
  </div>
</div>

<!-- generic modal (profile, setup, settings) -->
<div class="sheet" id="modal" role="dialog"><div class="sheet-in" id="modalBody"></div></div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, setDoc, addDoc, deleteDoc, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import * as S from "./scoring.js";
const { CATEGORIES, PR_BONUS, PRESETS, scoreEntries, aggregate, seasonStandings, weekWinners, streak, personalBests,
  weekStart, addDays, today, parseDate, dayIndex, basePoints, fmtPts, fmtAmt, rateText, applySettings } = S;

const firebaseConfig = {
  apiKey: "AIzaSyA0Zy1qUJMGsFfpK33OgO6hf5JxOPCUEiY",
  authDomain: "fitness-league-ccaf6.firebaseapp.com",
  projectId: "fitness-league-ccaf6",
  storageBucket: "fitness-league-ccaf6.firebasestorage.app",
  messagingSenderId: "111796351294",
  appId: "1:111796351294:web:79bbe43e74dd62e8803c6f"
};
const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);
const db = getFirestore(fb);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const COLORS = ["#c8ff3d","#3dd6ff","#ff6b9e","#ffb03d","#a78bfa","#4ade80","#f87171","#facc15"];
const EMOJIS = ["🔥","💪","🦍","🐐","🦈","🐺","🦅","🐻","⚡","🚀","👑","💀","🤠","😤","🧠","🎯"];
const REACTS = ["🔥","💪","👏","😂","🐐","🤡"];
const CAL_MODES = { cut: "Cut", maintain: "Maintain", bulk: "Bulk" };

const state = {
  me: null, users: {}, entries: [], reactions: [], settings: null, settingsLoaded: false,
  view: weekStart(today()), day: today(), open: null, tab: "board", pick: null, picker: null,
  cmpA: null, cmpB: null, cmpScope: "week", setupShown: false,
};
let unsub = [];

// ---------- auth ----------
$("signinBtn").onclick = async () => {
  $("signinErr").textContent = "";
  const provider = new GoogleAuthProvider();
  try { await signInWithPopup(auth, provider); }
  catch (e) {
    if (["auth/popup-blocked","auth/operation-not-supported-in-this-environment","auth/cancelled-popup-request"].includes(e.code))
      await signInWithRedirect(auth, provider);
    else if (e.code !== "auth/popup-closed-by-user") $("signinErr").textContent = "Sign-in failed: " + e.code;
  }
};

onAuthStateChanged(auth, async user => {
  unsub.forEach(u => u()); unsub = [];
  state.me = user; state.setupShown = false;
  $("loading").hidden = true;
  $("signin").hidden = !!user;
  $("app").hidden = !user;
  if (!user) { closeAll(); return; }

  const ref = doc(db, "users", user.uid);
  try {
    const snap = await getDoc(ref);
    if (!snap.exists()) await setDoc(ref, { name: (user.displayName || "Player").split(" ")[0].slice(0, 24), photo: user.photoURL || "", joined: Date.now() });
  } catch (e) { toast("Profile error: " + e.code); }

  unsub.push(onSnapshot(collection(db, "users"), s => {
    state.users = Object.fromEntries(s.docs.map(d => [d.id, d.data()]));
    if (!state.users[user.uid]?.onboarded && !state.setupShown) { state.setupShown = true; openSetup(true); }
    render();
  }));
  unsub.push(onSnapshot(collection(db, "entries"), s => {
    state.entries = s.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, err => toast("Couldn't load entries: " + err.code)));
  unsub.push(onSnapshot(collection(db, "reactions"), s => {
    state.reactions = s.docs.map(d => d.data());
    render();
  }, () => {}));
  unsub.push(onSnapshot(doc(db, "league", "settings"), async s => {
    state.settingsLoaded = true;
    if (!s.exists()) {
      // First person to open the site becomes the league admin.
      try { await setDoc(doc(db, "league", "settings"), { owner: user.uid, name: "Fitness League", activities: {} }); } catch {}
      return;
    }
    state.settings = s.data();
    applySettings(state.settings);
    render();
  }, () => { state.settingsLoaded = true; }));
});

// ---------- helpers ----------
const me = () => state.me?.uid;
const isOwner = () => state.settings?.owner === me();
const nameOf = uid => state.users[uid]?.name || "Player";
function colorOf(uid) {
  const c = state.users[uid]?.color;
  if (typeof c === "string" && /^#[0-9a-f]{6}$/i.test(c)) return c;
  let h = 0; for (const ch of uid || "") h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return COLORS[h % COLORS.length];
}
function avatar(uid, size = 32) {
  const u = state.users[uid] || {};
  const c = colorOf(uid);
  const st = `width:${size}px;height:${size}px;font-size:${Math.round(size * 0.5)}px`;
  if (u.avatar !== "emoji" && u.photo && /^https:\/\//.test(u.photo))
    return `<img class="avatar" style="${st};box-shadow:0 0 0 2px ${c}" src="${esc(u.photo)}" alt="" referrerpolicy="no-referrer">`;
  const glyph = u.avatar === "emoji" && u.emoji ? u.emoji : (nameOf(uid)[0] || "?").toUpperCase();
  return `<div class="avatar" style="${st};background:${c};color:#111">${esc(glyph)}</div>`;
}
const youTag = uid => uid === me() ? ' <span class="you">(you)</span>' : "";
function flame(uid) { const n = streak(state.entries, uid); return n >= 2 ? `<span class="flame">🔥${n}</span>` : ""; }
function goalLine(uid) {
  const g = state.users[uid]?.goals || {};
  const parts = [];
  if (g.protein > 0) parts.push(`Protein ${fmtAmt(g.protein)}g`);
  if (g.calories > 0) parts.push(`${CAL_MODES[g.calMode] || "Calories"} ${fmtAmt(g.calories)} cal`);
  if (g.weight > 0) parts.push(`${fmtAmt(g.weight)} lb`);
  return parts.join(" · ");
}
function amountText(e) {
  const a = S.ACT[e.activity];
  if (!a) return "";
  if (a.flat != null) return a.daily ? "Hit it" : "Done";
  return `${fmtAmt(Number(e.amount))} ${a.unit}`;
}
function rangeLabel(wk) {
  const s = parseDate(wk), e = parseDate(addDays(wk, 6));
  const m = d => d.toLocaleString("en-US", { month: "short" });
  return s.getMonth() === e.getMonth() ? `${m(s)} ${s.getDate()} – ${e.getDate()}` : `${m(s)} ${s.getDate()} – ${m(e)} ${e.getDate()}`;
}
const shortDate = s => parseDate(s).toLocaleDateString("en-US", { month: "short", day: "numeric" });

// ---------- tabs + nav ----------
document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
  state.tab = b.dataset.tab;
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === b));
  ["board","daily","season","compare","rules"].forEach(t => $("tab-" + t).hidden = t !== state.tab);
  $("logBtn").hidden = state.tab === "rules";
  render();
});
$("prevWk").onclick = () => { state.view = addDays(state.view, -7); state.open = null; render(); };
$("nextWk").onclick = () => { state.view = addDays(state.view, 7); state.open = null; render(); };
$("prevDay").onclick = () => { state.day = addDays(state.day, -1); render(); };
$("nextDay").onclick = () => { state.day = addDays(state.day, 1); render(); };
$("meBtn").onclick = () => openProfile(me());
$("settingsBtn").onclick = () => openSettings();

// Delegated clicks: delete, reactions, profiles.
document.addEventListener("click", async ev => {
  const t = ev.target.closest("[data-del],[data-react],[data-react-open],[data-profile]");
  if (!t) return;
  ev.stopPropagation();
  if (t.dataset.profile) return openProfile(t.dataset.profile);
  if (t.dataset.reactOpen) { state.picker = state.picker === t.dataset.reactOpen ? null : t.dataset.reactOpen; return render(); }
  if (t.dataset.react) {
    const [entryId, emoji] = t.dataset.react.split("|");
    const rid = `${entryId}_${me()}`;
    const mine = state.reactions.find(r => r.entryId === entryId && r.uid === me());
    state.picker = null;
    try {
      if (mine?.emoji === emoji) await deleteDoc(doc(db, "reactions", rid));
      else await setDoc(doc(db, "reactions", rid), { entryId, uid: me(), emoji, at: Date.now() });
    } catch (e) { toast("Couldn't react: " + e.code); }
    return;
  }
  if (t.dataset.del) {
    if (!confirm("Delete this entry?")) return;
    try { await deleteDoc(doc(db, "entries", t.dataset.del)); toast("Deleted"); }
    catch (e) { toast("Couldn't delete: " + e.code); }
  }
}, true);

// ---------- render ----------
function render() {
  if (!state.me) return;
  const name = state.settings?.name || "Fitness League";
  $("brand").textContent = name; document.title = name;
  $("meBtn").innerHTML = avatar(me(), 36);
  $("settingsBtn").hidden = !isOwner();
  const scores = scoreEntries(state.entries);
  const weeks = aggregate(state.entries, scores);
  const uids = Object.keys(state.users);
  if (state.tab === "board") renderBoard(weeks, uids);
  if (state.tab === "daily") renderDaily(scores, uids);
  if (state.tab === "season") renderSeason(weeks, uids);
  if (state.tab === "compare") renderCompare(weeks, uids);
  if (state.tab === "rules") renderRules();
}

function reactionsHTML(entryId) {
  const mine = state.reactions.find(r => r.entryId === entryId && r.uid === me())?.emoji;
  const counts = {};
  for (const r of state.reactions) if (r.entryId === entryId && REACTS.includes(r.emoji)) counts[r.emoji] = (counts[r.emoji] || 0) + 1;
  const chips = Object.entries(counts).map(([e, n]) =>
    `<button class="rchip ${mine === e ? "mine" : ""}" data-react="${esc(entryId)}|${e}">${e} ${n}</button>`).join("");
  const picker = state.picker === entryId
    ? REACTS.map(e => `<button class="rchip ${mine === e ? "mine" : ""}" data-react="${esc(entryId)}|${e}">${e}</button>`).join("")
    : `<button class="radd" data-react-open="${esc(entryId)}">+ react</button>`;
  return `<div class="reacts">${chips}${picker}</div>`;
}

function entryHTML(e, showDay) {
  const a = S.ACT[e.activity];
  const mine = e.uid === me();
  const sub = [showDay ? DAYS[dayIndex(e.date)] : "", e.note ? esc(e.note) : "",
    e.pr && e.prev != null ? `beat ${fmtAmt(e.prev)}` : "", a.daily && e.base === 0 ? "duplicate, 0 pts" : ""].filter(Boolean).join(" · ");
  return `<div class="entry">
    <div class="e-top">
      <div>${a.icon}</div>
      <div class="e-main"><div>${esc(a.label)} · ${esc(amountText(e))}${e.pr ? '<span class="pr">PR +' + PR_BONUS + '</span>' : ""}</div>
      ${sub ? `<div class="e-sub">${sub}</div>` : ""}</div>
      <div class="e-pts">+${fmtPts(e.points)}</div>
      ${mine ? `<button class="del" data-del="${esc(e.id)}" aria-label="Delete entry">×</button>` : ""}
    </div>
    ${reactionsHTML(e.id)}
  </div>`;
}
const byNewest = (a, b) => (b.date + String(b.createdAt || 0).padStart(15, "0")).localeCompare(a.date + String(a.createdAt || 0).padStart(15, "0"));

function recapHTML(wk, weeks, title) {
  const players = weeks[wk] || {};
  const winners = weekWinners(players);
  if (!winners.length) return "";
  const w = winners[0], p = players[w];
  const topCat = Object.entries(p.cats).sort((a, b) => b[1] - a[1])[0];
  const prs = Object.values(players).flatMap(x => x.entries.filter(e => e.pr));
  const most = Object.entries(players).sort((a, b) => b[1].entries.length - a[1].entries.length)[0];
  const items = [
    `🏆 <b>${winners.map(u => esc(nameOf(u))).join(" & ")}</b> ${winners.length > 1 ? "tied" : "won"} with <b>${fmtPts(p.total)}</b> pts`,
    topCat ? `💥 ${esc(nameOf(w))}'s biggest category: <b>${esc(topCat[0])}</b> (${fmtPts(topCat[1])} pts)` : "",
    prs.length ? `🥇 PRs: ${prs.slice(0, 4).map(e => `${esc(nameOf(e.uid))} ${esc(S.ACT[e.activity].label.toLowerCase())} (${fmtAmt(Number(e.amount))})`).join(", ")}${prs.length > 4 ? ` +${prs.length - 4} more` : ""}` : "",
    most ? `📈 Most active: <b>${esc(nameOf(most[0]))}</b> with ${most[1].entries.length} entries` : "",
  ].filter(Boolean);
  return `<div class="card pad recap"><h3 class="display">${title}</h3><ul>${items.map(i => `<li>${i}</li>`).join("")}</ul></div>`;
}

function renderBoard(weeks, uids) {
  const cur = weekStart(today());
  const earliest = state.entries.reduce((m, e) => { const w = weekStart(e.date); return w < m ? w : m; }, cur);
  $("prevWk").disabled = state.view <= earliest;
  $("nextWk").disabled = state.view >= cur;
  $("wkLabel").textContent = rangeLabel(state.view);
  updateLock(weeks);
  $("recap").innerHTML = state.view < cur ? recapHTML(state.view, weeks, "Week recap") : "";

  const wk = weeks[state.view] || {};
  const rows = uids.map(uid => ({ uid, ...(wk[uid] || { total: 0, cats: {}, days: [0,0,0,0,0,0,0], entries: [] }) }))
    .sort((a, b) => b.total - a.total);
  if (!rows.length) { $("board").innerHTML = `<div class="empty">No players yet.</div>`; return; }
  const top = Math.max(rows[0].total, 1);
  let rank = 0, prev = null;
  $("board").innerHTML = rows.map((r, i) => {
    if (r.total !== prev) { rank = i + 1; prev = r.total; }
    const behind = rows[0].total - r.total;
    const sub = r.total === 0 ? "No points yet" : rank === 1 ? (rows.length > 1 && rows[1].total === r.total ? "Tied for 1st" : "Leading") : `${fmtPts(behind)} behind`;
    return `
    <div class="card r${rank} ${state.open === r.uid ? "open" : ""}" data-uid="${esc(r.uid)}">
      <button class="row toggle">
        <div class="rank display">${rank}</div>
        ${avatar(r.uid, 40)}
        <div><div class="name">${esc(nameOf(r.uid))}${youTag(r.uid)}${flame(r.uid)}</div><div class="sub">${sub}</div></div>
        <div class="pts display">${fmtPts(r.total)}<small>pts</small></div>
      </button>
      <div class="bar"><i style="width:${Math.max(0, r.total / top * 100)}%;${rank === 1 ? "" : `background:${colorOf(r.uid)}`}"></i></div>
      <div class="detail">
        <div class="cats">${CATEGORIES.map(c => `<div class="cat"><div class="display">${fmtPts(r.cats[c] || 0)}</div><span>${c}</span></div>`).join("")}</div>
        <div class="days">${r.days.map((p, d) => `<div class="day ${p ? "" : "zero"}"><span>${DAYS[d]}</span><b>${fmtPts(p)}</b></div>`).join("")}</div>
        <div>${r.entries.length ? [...r.entries].sort(byNewest).map(e => entryHTML(e, true)).join("")
          : `<div class="muted" style="font-size:14px">Nothing logged this week.</div>`}</div>
        <div style="margin-top:12px"><button class="link" data-profile="${esc(r.uid)}">View profile →</button></div>
      </div>
    </div>`;
  }).join("");
  $("board").querySelectorAll(".toggle").forEach(b => b.onclick = () => {
    const uid = b.closest(".card").dataset.uid;
    state.open = state.open === uid ? null : uid;
    render();
  });
}

function updateLock(weeks) {
  const cur = weekStart(today());
  if (state.view !== cur) { $("lockLabel").textContent = "Final"; return; }
  const end = parseDate(addDays(cur, 7));
  let ms = Math.max(0, end - Date.now());
  const d = Math.floor(ms / 864e5); ms -= d * 864e5;
  const h = Math.floor(ms / 36e5); ms -= h * 36e5;
  const m = Math.floor(ms / 6e4);
  const last = weekWinners(weeks[addDays(cur, -7)]);
  $("lockLabel").innerHTML = `Week locks in <b>${d ? d + "d " : ""}${h}h ${m}m</b>`
    + (last.length ? ` · Last week's champ: <b>${last.map(u => esc(nameOf(u))).join(" & ")}</b>` : "");
}
setInterval(() => { if (state.me && state.tab === "board") render(); }, 30000);

function renderDaily(scores, uids) {
  const t = today();
  if (state.day > t) state.day = t;
  const earliest = state.entries.reduce((m, e) => (e.date < m ? e.date : m), t);
  $("prevDay").disabled = state.day <= earliest;
  $("nextDay").disabled = state.day >= t;
  const d = parseDate(state.day);
  $("dayLabel").textContent = state.day === t ? "Today" : state.day === addDays(t, -1) ? "Yesterday" : d.toLocaleDateString("en-US", { weekday: "long" });
  $("dayStrip").textContent = d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });

  const byUid = {};
  for (const e of state.entries) {
    if (e.date !== state.day) continue;
    const s = scores.get(e.id);
    if (s) (byUid[e.uid] ??= []).push({ ...e, ...s });
  }
  const rows = uids.map(uid => {
    const es = (byUid[uid] || []).sort(byNewest);
    const cats = {}; let total = 0;
    for (const e of es) { total += e.points; const c = S.ACT[e.activity].cat; cats[c] = (cats[c] || 0) + e.points; }
    return { uid, es, cats, total };
  }).sort((a, b) => b.total - a.total);
  if (!rows.length) { $("daily").innerHTML = `<div class="empty">No players yet.</div>`; return; }
  $("daily").innerHTML = rows.map(r => {
    const gl = goalLine(r.uid);
    return `<div class="card">
      <div class="row" style="grid-template-columns:40px 1fr auto">
        <button data-profile="${esc(r.uid)}">${avatar(r.uid, 40)}</button>
        <div><div class="name">${esc(nameOf(r.uid))}${youTag(r.uid)}${flame(r.uid)}</div>
          <div class="sub">${r.es.length ? `${r.es.length} activit${r.es.length === 1 ? "y" : "ies"}` : "Nothing logged"}</div>
          ${gl ? `<div class="goalline">🎯 ${esc(gl)}</div>` : ""}</div>
        <div class="pts display">${fmtPts(r.total)}<small>pts</small></div>
      </div>
      ${r.es.length ? `<div style="padding:0 16px 12px">
        <div class="dchips">${CATEGORIES.filter(c => r.cats[c]).map(c => `<span class="dchip">${c} <b>${fmtPts(r.cats[c])}</b></span>`).join("")}</div>
        ${r.es.map(e => entryHTML(e, false)).join("")}
      </div>` : ""}
    </div>`;
  }).join("");
}

function chartSVG(weeks, uids) {
  const cur = weekStart(today());
  const allWks = Object.keys(weeks).sort();
  if (!allWks.length) return `<div class="muted" style="font-size:14px">Log some activity to see the chart.</div>`;
  const wks = [];
  for (let w = allWks[0]; w <= cur; w = addDays(w, 7)) wks.push(w);
  const shown = wks.slice(-10);
  const W = 640, H = 240, L = 40, R = 12, T = 12, B = 30;
  const max = Math.max(10, ...shown.flatMap(w => uids.map(u => weeks[w]?.[u]?.total || 0)));
  const nice = Math.ceil(max / 50) * 50;
  const x = i => shown.length === 1 ? L + (W - L - R) / 2 : L + i * (W - L - R) / (shown.length - 1);
  const y = v => T + (H - T - B) * (1 - v / nice);
  let g = "";
  for (let k = 0; k <= 4; k++) {
    const v = nice * k / 4;
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtPts(v)}</text>`;
  }
  shown.forEach((w, i) => { if (shown.length <= 6 || i % 2 === shown.length % 2 || i === shown.length - 1)
    g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${shortDate(w)}</text>`; });
  for (const u of uids) {
    const pts = shown.map((w, i) => [x(i), y(weeks[w]?.[u]?.total || 0)]);
    const c = colorOf(u);
    g += `<polyline fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p => p.join(",")).join(" ")}"/>`;
    g += pts.map(([px, py]) => `<circle cx="${px}" cy="${py}" r="3.5" fill="${c}"/>`).join("");
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Weekly points by player">${g}</svg>
    <div class="legend">${uids.map(u => `<span><i style="background:${colorOf(u)}"></i>${esc(nameOf(u))}</span>`).join("")}</div>`;
}

function renderSeason(weeks, uids) {
  const cur = weekStart(today());
  const rows = seasonStandings(weeks, uids, cur);
  const done = Object.keys(weeks).filter(w => w < cur).length;
  $("season").innerHTML = `
    <h2 class="display">Season standings</h2>
    <p class="muted" style="margin-bottom:14px;font-size:14px">${done} finished week${done === 1 ? "" : "s"}. Ranked by weekly wins, then total points.</p>
    <div class="card" style="padding:4px 8px"><table>
      <thead><tr><th>#</th><th>Player</th><th>Wins</th><th>Total</th><th>Best wk</th></tr></thead>
      <tbody>${rows.map((r, i) => `<tr>
        <td class="n">${i + 1}</td>
        <td><button data-profile="${esc(r.uid)}" style="display:flex;align-items:center;gap:8px;text-align:left">${avatar(r.uid)}<b>${esc(nameOf(r.uid))}</b>${flame(r.uid)}</button></td>
        <td class="n" style="color:var(--gold)">${r.wins}</td>
        <td class="n">${fmtPts(r.total)}</td>
        <td class="n">${fmtPts(r.bestWeek)}</td></tr>`).join("")}</tbody>
    </table></div>
    <h3 class="display sec">Points per week</h3>
    <div class="card pad">${chartSVG(weeks, uids)}</div>`;
}

function renderCompare(weeks, uids) {
  if (uids.length < 2) { $("compare").innerHTML = `<h2 class="display">Head to head</h2><div class="empty">Need at least two players.</div>`; return; }
  if (!uids.includes(state.cmpA)) state.cmpA = uids.includes(me()) ? me() : uids[0];
  if (!uids.includes(state.cmpB) || state.cmpB === state.cmpA) state.cmpB = uids.find(u => u !== state.cmpA);
  const cur = weekStart(today());
  const pick = uid => {
    if (state.cmpScope === "week") return weeks[cur]?.[uid] || { total: 0, cats: {}, acts: {} };
    const out = { total: 0, cats: {}, acts: {} };
    for (const w of Object.values(weeks)) { const p = w[uid]; if (!p) continue;
      out.total += p.total;
      for (const [k, v] of Object.entries(p.cats)) out.cats[k] = (out.cats[k] || 0) + v;
      for (const [k, v] of Object.entries(p.acts)) out.acts[k] = (out.acts[k] || 0) + v; }
    return out;
  };
  const A = pick(state.cmpA), B = pick(state.cmpB);
  const st = seasonStandings(weeks, uids, cur);
  const wins = u => st.find(r => r.uid === u)?.wins || 0;
  const row = (label, a, b, fmt = fmtPts) => `<tr><td>${label}</td>
    <td class="n ${a > b ? "win" : ""}" style="text-align:right">${fmt(a)}</td>
    <td class="n ${b > a ? "win" : ""}" style="text-align:right">${fmt(b)}</td></tr>`;
  const actRows = S.ACTIVITIES.filter(a => (A.acts[a.id] || 0) + (B.acts[a.id] || 0) > 0).map(a =>
    row(`${a.icon} ${esc(a.label)} <span class="muted">${a.flat != null ? "(times)" : `(${esc(a.unit)})`}</span>`, A.acts[a.id] || 0, B.acts[a.id] || 0, fmtAmt)).join("");
  const opt = sel => uids.map(u => `<option value="${esc(u)}" ${u === sel ? "selected" : ""}>${esc(nameOf(u))}</option>`).join("");
  $("compare").innerHTML = `
    <h2 class="display">Head to head</h2>
    <div class="cmp-sel"><select id="cmpA">${opt(state.cmpA)}</select><span class="vs">VS</span><select id="cmpB">${opt(state.cmpB)}</select></div>
    <div class="seg" style="margin-bottom:14px"><button data-scope="week" class="${state.cmpScope === "week" ? "on" : ""}">This week</button><button data-scope="all" class="${state.cmpScope === "all" ? "on" : ""}">All time</button></div>
    <div class="card" style="padding:4px 8px"><table>
      <thead><tr><th></th><th style="text-align:right">${esc(nameOf(state.cmpA))}</th><th style="text-align:right">${esc(nameOf(state.cmpB))}</th></tr></thead>
      <tbody>
        ${row("<b>Total points</b>", A.total, B.total)}
        ${CATEGORIES.map(c => row(c, A.cats[c] || 0, B.cats[c] || 0)).join("")}
        ${row("Weekly wins", wins(state.cmpA), wins(state.cmpB))}
        ${row("Current streak 🔥", streak(state.entries, state.cmpA), streak(state.entries, state.cmpB))}
        ${actRows}
      </tbody>
    </table></div>`;
  $("cmpA").onchange = e => { state.cmpA = e.target.value; render(); };
  $("cmpB").onchange = e => { state.cmpB = e.target.value; render(); };
  $("compare").querySelectorAll("[data-scope]").forEach(b => b.onclick = () => { state.cmpScope = b.dataset.scope; render(); });
}

function renderRules() {
  const acts = S.ACTIVITIES.filter(a => !a.hidden);
  $("rules").innerHTML = `
    <h2 class="display">How points work</h2>
    <div class="card" style="padding:4px 8px"><table>
      <thead><tr><th>Activity</th><th>Points</th></tr></thead>
      <tbody>${acts.map(a => `<tr><td>${a.icon} <b>${esc(a.label)}</b>${a.note ? `<div class="note">${esc(a.note)}</div>` : ""}</td><td style="white-space:nowrap">${esc(rateText(a))}</td></tr>`).join("")}</tbody>
    </table></div>
    <h3 class="display sec">Rules</h3>
    <ul class="rules">
      <li>Weeks run Monday to Sunday. Highest total at Sunday 11:59 PM wins the week.</li>
      <li><b>Personal records: +${PR_BONUS}.</b> Beat your best single entry in run, swim, bike, pushups or pullups. Your first week doing an activity sets the baseline, so PRs start the week after. Max one PR per activity per week.</li>
      <li>Daily goals count once per day. Set your protein and calorie targets in your profile so everyone knows what you're aiming for.</li>
      <li>No daily caps. 🔥 = streak of days in a row with at least one activity.</li>
      <li>Honor system. You can only add or delete your own entries.</li>

// ---------- modal: profile, setup, settings ----------
function openModal(html, { locked = false } = {}) {
  $("modalBody").innerHTML = html;
  $("modal").dataset.locked = locked ? "1" : "";
  $("scrim").classList.add("on"); $("modal").classList.add("on");
}
function closeModal() { $("modal").classList.remove("on"); if (!$("sheet").classList.contains("on")) $("scrim").classList.remove("on"); }
function closeAll() { $("modal").classList.remove("on"); $("sheet").classList.remove("on"); $("scrim").classList.remove("on"); }
$("scrim").onclick = () => { if ($("modal").classList.contains("on")) { if (!$("modal").dataset.locked) closeModal(); } else closeSheet(); };

  const weeks = aggregate(state.entries, scores);

  const pbs = personalBests(state.entries, uid);
  const gl = goalLine(uid);

    <div class="prof-head">${avatar(uid, 64)}<div><h3 class="display">${esc(nameOf(uid))}</h3>${gl ? `<div class="goalline" style="font-size:13px">🎯 ${esc(gl)}</div>` : `<div class="goalline">No goals set</div>`}</div></div>
    <div class="stats">
      <div class="stat"><div class="display">${fmtPts(weeks[cur]?.[uid]?.total || 0)}</div><span>This week</span></div>
      <div class="stat"><div class="display">${fmtPts(row.total)}</div><span>All time</span></div>
      <div class="stat"><div class="display" style="color:var(--gold)">${row.wins}</div><span>Weekly wins</span></div>
      <div class="stat"><div class="display">${streak(state.entries, uid)}</div><span>Day streak 🔥</span></div>
    </div>

    ${Object.keys(pbs).length ? `<div class="card" style="padding:4px 8px;margin:0"><table><tbody>${Object.entries(pbs).map(([id, p]) => {
      const a = S.ACT[id]; return `<tr><td>${a.icon} ${esc(a.label)}</td><td class="n" style="text-align:right">${fmtAmt(p.amount)} <span class="muted" style="font-family:Inter;font-size:12px">${esc(a.unit)} · ${shortDate(p.date)}</span></td></tr>`;
    }).join("")}</tbody></table></div>` : `<div class="muted" style="font-size:14px">None yet.</div>`}
    <div class="actions">
      ${mine ? `<button class="btn btn-ghost" id="pfSignout">Sign out</button><button class="btn btn-primary" id="pfEdit">Edit profile</button>`
             : `<button class="btn btn-ghost" id="pfClose">Close</button>`}
    </div>`);
  if (mine) { $("pfEdit").onclick = () => openSetup(false); $("pfSignout").onclick = () => { closeAll(); signOut(auth); }; }
  else $("pfClose").onclick = closeModal;
}

function openSetup(first) {
  const u = state.users[me()] || {};
  const g = u.goals || {};
  const hasGoogle = !!state.me.photoURL;
  let sel = { avatar: u.avatar || (hasGoogle ? "google" : "emoji"), emoji: u.emoji || EMOJIS[0], color: colorOf(me()) };
  openModal(`
    <h3 class="display">${first ? "Set up your profile" : "Edit profile"}</h3>
    ${first ? `<p class="note" style="margin-top:6px">This is what your friends see. You can change it anytime.</p>` : ""}
    <div class="field"><label for="suName">Display name</label><input id="suName" maxlength="24" value="${esc(u.name || "")}"></div>
    <div class="grp">Avatar</div>
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:10px"><div id="suPreview"></div>
      <div class="seg">${hasGoogle ? `<button data-av="google">Google photo</button>` : ""}<button data-av="emoji">Emoji</button></div></div>
    <div id="suEmojiWrap"><div class="emojis">${EMOJIS.map(e => `<button data-em="${e}">${e}</button>`).join("")}</div></div>
    <div class="grp">Your color</div>
    <div class="swatches">${COLORS.map(c => `<button class="swatch" data-col="${c}" style="background:${c}" aria-label="Color ${c}"></button>`).join("")}</div>
    <div class="grp">Goals (everyone can see these)</div>
    <div class="two">
      <div class="field" style="margin:0"><label for="suProtein">Protein target (g/day)</label><input id="suProtein" type="number" inputmode="numeric" min="0" value="${g.protein || ""}"></div>
      <div class="field" style="margin:0"><label for="suWeight">Bodyweight (lb, optional)</label><input id="suWeight" type="number" inputmode="numeric" min="0" value="${g.weight || ""}"></div>
      <div class="field" style="margin:0"><label for="suMode">Calorie goal</label><select id="suMode">${Object.entries(CAL_MODES).map(([k, v]) => `<option value="${k}" ${g.calMode === k ? "selected" : ""}>${v}</option>`).join("")}</select></div>
      <div class="field" style="margin:0"><label for="suCal">Calories per day</label><input id="suCal" type="number" inputmode="numeric" min="0" value="${g.calories || ""}"></div>
    </div>
    <p class="note" style="margin-top:8px">Tip: a common protein target is 1 g per lb of bodyweight.</p>
    <div class="err" id="suErr"></div>
    <div class="actions">${first ? "" : `<button class="btn btn-ghost" id="suCancel">Cancel</button>`}<button class="btn btn-primary" id="suSave">${first ? "Let's go" : "Save"}</button></div>`,
    { locked: first });

  const paint = () => {
    const prev = { ...state.users[me()], avatar: sel.avatar, emoji: sel.emoji, color: sel.color, name: $("suName").value || "?" };
    const saved = state.users[me()]; state.users[me()] = prev;
    $("suPreview").innerHTML = avatar(me(), 56);
    state.users[me()] = saved;
    document.querySelectorAll("[data-av]").forEach(b => b.classList.toggle("on", b.dataset.av === sel.avatar));
    document.querySelectorAll("[data-em]").forEach(b => b.classList.toggle("on", b.dataset.em === sel.emoji));
    document.querySelectorAll("[data-col]").forEach(b => b.classList.toggle("on", b.dataset.col === sel.color));
    $("suEmojiWrap").hidden = sel.avatar !== "emoji";
  };
  document.querySelectorAll("[data-av]").forEach(b => b.onclick = () => { sel.avatar = b.dataset.av; paint(); });
  document.querySelectorAll("[data-em]").forEach(b => b.onclick = () => { sel.emoji = b.dataset.em; paint(); });
  document.querySelectorAll("[data-col]").forEach(b => b.onclick = () => { sel.color = b.dataset.col; paint(); });
  $("suName").oninput = paint;
  paint();
  if (!first) $("suCancel").onclick = closeModal;
  $("suSave").onclick = async () => {
    const name = $("suName").value.trim().slice(0, 24);
    if (!name) { $("suErr").textContent = "Pick a display name."; return; }
    const n = id => { const v = Number($(id).value); return v > 0 && v < 100000 ? v : 0; };
    try {
      await setDoc(doc(db, "users", me()), {
        name, avatar: sel.avatar, emoji: sel.emoji, color: sel.color, photo: state.me.photoURL || "",
        goals: { protein: n("suProtein"), weight: n("suWeight"), calMode: $("suMode").value, calories: n("suCal") },
        onboarded: true,
      }, { merge: true });
      closeModal(); toast("Profile saved");
    } catch (e) { $("suErr").textContent = "Couldn't save: " + e.code; }
  };
}

function splitRate(a) {
  for (const n of [1, 3, 10, 100]) { const p = a.rate * n; if (p >= 1 && Math.abs(p - Math.round(p)) < 1e-9) return { pts: Math.round(p), per: n }; }
  return { pts: +a.rate.toFixed(3), per: 1 };
}

function openSettings() {
  if (!isOwner()) return;
  const acts = S.ACTIVITIES;
  const rowHTML = a => {
    const flat = a.flat != null;
    const r = flat ? null : splitRate(a);
    return `<div class="set-row" data-id="${esc(a.id)}" data-flat="${flat ? 1 : 0}">
      <div class="lbl">${a.icon}<input class="s-label" value="${esc(a.label)}" maxlength="30"></div>
      <input class="s-pts" type="number" min="0" step="any" value="${flat ? a.flat : r.pts}" title="Points">
      ${flat ? `<span class="muted">${a.daily ? "/day" : "flat"}</span>` : `<input class="s-per" type="number" min="1" value="${r.per}" title="Per how many ${esc(a.unit)}">`}
      <label style="display:flex;gap:4px;align-items:center;white-space:nowrap"><input class="s-hide" type="checkbox" style="width:auto" ${a.hidden ? "checked" : ""}>Hide</label>
    </div>`;
  };
  openModal(`
    <h3 class="display">League settings</h3>
    <p class="note" style="margin-top:6px">Only you can change these. Point changes apply to everyone's past entries too.</p>
    <div class="field"><label for="stName">League name</label><input id="stName" maxlength="30" value="${esc(state.settings?.name || "Fitness League")}"></div>
    <div class="grp">Activities · name · points · per (units) · hide</div>
    <div id="stActs">${acts.map(rowHTML).join("")}</div>
    <div class="grp">Add a custom activity</div>
    <div class="two">
      <input id="caLabel" placeholder="Name (e.g. Plank)" maxlength="30">
      <input id="caIcon" placeholder="Emoji (e.g. 🧱)" maxlength="4">
      <select id="caCat">${CATEGORIES.map(c => `<option>${c}</option>`).join("")}</select>
      <select id="caType"><option value="unit">Points per amount</option><option value="flat">Flat points per entry</option><option value="daily">Daily goal (once a day)</option></select>
      <input id="caPts" type="number" min="0" step="any" placeholder="Points">
      <div class="inline" id="caUnitWrap"><span>per</span><input id="caPer" type="number" min="1" value="1" style="width:70px"><input id="caUnit" placeholder="unit (minutes)" maxlength="15"></div>
    </div>
    <button class="btn btn-ghost btn-sm" id="caAdd" style="margin-top:10px">+ Add activity</button>
    <div class="err" id="stErr"></div>
    <div class="actions"><button class="btn btn-ghost" id="stCancel">Cancel</button><button class="btn btn-primary" id="stSave">Save settings</button></div>`);

  const pending = {};
  $("caType").onchange = () => { $("caUnitWrap").style.visibility = $("caType").value === "unit" ? "visible" : "hidden"; };
  $("caAdd").onclick = () => {
    const label = $("caLabel").value.trim(), pts = Number($("caPts").value);
    if (!label || !(pts >= 0) || $("caPts").value === "") { $("stErr").textContent = "Custom activity needs a name and points."; return; }
    const id = "c_" + label.toLowerCase().replace(/[^a-z0-9]+/g, "_").slice(0, 20) + "_" + Math.random().toString(36).slice(2, 6);
    const type = $("caType").value;
    const o = { label, icon: $("caIcon").value.trim() || "⭐", cat: $("caCat").value, custom: true };
    if (type === "unit") { const per = Math.max(1, Number($("caPer").value) || 1); o.rate = pts / per; o.unit = $("caUnit").value.trim() || "units"; }
    else { o.flat = pts; o.daily = type === "daily"; }
    pending[id] = o;
    const tmp = { id, ...o, hidden: false };
    $("stActs").insertAdjacentHTML("beforeend", rowHTML(tmp));
    ["caLabel","caIcon","caPts","caUnit"].forEach(i => $(i).value = ""); $("stErr").textContent = "";
  };
  $("stCancel").onclick = closeModal;
  $("stSave").onclick = async () => {
    const out = {};
    const old = state.settings?.activities || {};
    for (const rowEl of $("stActs").querySelectorAll(".set-row")) {
      const id = rowEl.dataset.id;
      const base = S.DEFAULT_ACTIVITIES.find(a => a.id === id);
      const src = base || old[id] || pending[id] || {};
      const o = base ? {} : { ...src };
      delete o.custom;
      const label = rowEl.querySelector(".s-label").value.trim();
      if (label) o.label = label.slice(0, 30);
      const pts = Number(rowEl.querySelector(".s-pts").value);
      if (!(pts >= 0)) { $("stErr").textContent = `Points for ${label || id} must be a number.`; return; }
      if (rowEl.dataset.flat === "1") o.flat = pts;
      else { const per = Math.max(1, Number(rowEl.querySelector(".s-per").value) || 1); o.rate = pts / per; }
      o.hidden = rowEl.querySelector(".s-hide").checked;
      out[id] = o;
    }
    try {
      await setDoc(doc(db, "league", "settings"), { owner: me(), name: $("stName").value.trim().slice(0, 30) || "Fitness League", activities: out });
      closeModal(); toast("Settings saved");
    } catch (e) { $("stErr").textContent = "Couldn't save: " + e.code; }
  };
}

// ---------- log sheet (one-tap) ----------
function openSheet() {
  state.pick = null;
  $("logErr").textContent = ""; $("amt").value = ""; $("noteIn").value = "";
  const t = today(), wk = weekStart(t);
  const opts = [];
  for (let d = t; d >= wk; d = addDays(d, -1)) {
    const lbl = d === t ? "Today" : d === addDays(t, -1) ? "Yesterday" : DAYS[dayIndex(d)];
    opts.push(`<option value="${d}">${lbl} · ${shortDate(d)}</option>`);
  }
  $("dateIn").innerHTML = opts.join("");
  drawChips();
  $("scrim").classList.add("on"); $("sheet").classList.add("on");
}
function closeSheet() { $("scrim").classList.remove("on"); $("sheet").classList.remove("on"); }
function loggedDaily(id, date) { return state.entries.some(e => e.uid === me() && e.activity === id && e.date === date); }
function drawChips() {
  const date = $("dateIn").value;
  $("actChips").innerHTML = CATEGORIES.map(c => {
    const list = S.ACTIVITIES.filter(a => a.cat === c && !a.hidden);
    if (!list.length) return "";
    return `<div class="grp">${c}</div><div class="chips">${list.map(a => {
      const done = a.daily && loggedDaily(a.id, date);
      const tag = a.flat != null ? ` · +${fmtPts(a.flat)}` : "";
      return `<button class="chip ${state.pick === a.id ? "on" : ""}" data-act="${esc(a.id)}" ${done ? "disabled" : ""}>${a.icon} ${esc(a.label)}${done ? " ✓" : tag}</button>`;
    }).join("")}</div>`;
  }).join("");
  $("actChips").querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
    const a = S.ACT[b.dataset.act];
    if (a.flat != null) { state.pick = null; quickLog(a.id, 1); }
    else { state.pick = state.pick === a.id ? null : a.id; drawChips(); }
  });
  syncPanel();
}
function syncPanel() {
  const a = S.ACT[state.pick];
  $("amtPanel").hidden = !a;
  if (!a) return;
  $("actNote").textContent = a.note || "";
  $("noteField").hidden = !a.askNote;
  $("presetLbl").textContent = `${a.label} (${a.unit})`;
  $("presets").innerHTML = (PRESETS[a.id] || []).map(v =>
    `<button class="chip preset" data-v="${v}">${v} · +${fmtPts(basePoints(a.id, v))}</button>`).join("");
  $("presets").querySelectorAll("[data-v]").forEach(b => b.onclick = () => quickLog(a.id, Number(b.dataset.v)));
  $("unit").textContent = a.unit;
  $("amt").step = a.step || 1;
  updatePreview();
}
function updatePreview() {
  const a = S.ACT[state.pick], v = Number($("amt").value);
  $("preview").textContent = a && v > 0 ? "+" + fmtPts(basePoints(a.id, v)) : "";
}
$("amt").oninput = updatePreview;
$("dateIn").onchange = drawChips;
$("logBtn").onclick = openSheet;
$("cancelLog").onclick = closeSheet;
$("saveLog").onclick = () => {
  const a = S.ACT[state.pick];
  if (!a) return;
  const v = Number($("amt").value);
  if (!(v > 0)) { $("logErr").textContent = `Enter ${a.unit}.`; return; }
  quickLog(a.id, v);
};

let busy = false;
async function quickLog(id, amount) {
  const a = S.ACT[id];
  $("logErr").textContent = "";
  if (amount > 100000) { $("logErr").textContent = "That's a lot. Double-check the number."; return; }
  const date = $("dateIn").value;
  if (a.daily && loggedDaily(id, date)) { $("logErr").textContent = "Already logged for that day."; return; }
  if (busy) return;
  busy = true;
  const entry = { uid: me(), activity: id, amount, date, createdAt: Date.now() };
  const note = $("noteIn").value.trim();
  if (a.askNote && note) entry.note = note.slice(0, 80);
  try {
    const ref = await addDoc(collection(db, "entries"), entry);
    $("amt").value = ""; $("noteIn").value = "";
    state.view = weekStart(today());
    const what = a.flat != null ? a.label : `${fmtAmt(amount)} ${a.unit} ${a.label.toLowerCase()}`;
    toast(`${a.icon} ${what} · +${fmtPts(basePoints(id, amount))}`, "Undo", () => deleteDoc(doc(db, "entries", ref.id)));
    drawChips();
  } catch (e) { $("logErr").textContent = "Couldn't save: " + e.code; }
  finally { busy = false; }
}

let toastT;
function toast(msg, actionLabel, action) {
  const t = $("toast");
  t.textContent = msg;
  if (actionLabel) {
    const b = document.createElement("button");
    b.textContent = actionLabel;
    b.onclick = async () => { t.classList.remove("on"); try { await action(); toast("Removed"); } catch { toast("Couldn't undo"); } };
    t.appendChild(b);
  }
  t.classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove("on"), actionLabel ? 5000 : 2200);
}
</script>
